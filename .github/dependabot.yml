# Dependabot opens PRs with updated NuGet refs and GitHub Action pins.
# The Build workflow runs on those PRs (without publishing to NuGet).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "15:00"
    groups:
      all-nuget:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(nuget)"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "15:00"
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"